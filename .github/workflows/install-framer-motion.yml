name: Install Framer Motion dependency
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/install-framer-motion.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Framer Motion and update pnpm lockfile
        run: pnpm add framer-motion
      - name: Commit dependency and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "feat: add framer-motion and update lockfile"
          git push origin main
