<!doctype html>
<html lang="en">
  <body style="margin:0;padding:32px 16px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#18202b;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #e5e7eb;border-radius:16px;">
      <tr>
        <td style="padding:32px;">
          <h1 style="margin:0 0 12px;font-size:24px;">Your StudySmart sign-in code</h1>
          <p style="margin:0 0 24px;color:#596273;line-height:1.5;">Enter this one-time code in StudySmart to finish signing in.</p>
          <p style="margin:0 0 24px;padding:18px;background:#f3f5f8;border-radius:12px;text-align:center;font-size:32px;font-weight:700;letter-spacing:10px;">{{ .Token }}</p>
          <p style="margin:0;color:#596273;line-height:1.5;">This code can be used once. If you did not request it, you can ignore this email.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
